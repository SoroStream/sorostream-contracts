name: Coverage

on:
  pull_request:
  push:
    branches: [main]

jobs:
  coverage:
    name: Line Coverage (≥ 80%)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          # llvm-cov requires the llvm-tools-preview component.
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-llvm-cov
        # Pin to a known-good version so the job is reproducible.
        run: cargo install cargo-llvm-cov --version 0.6.10 --locked

      - name: Run tests with coverage instrumentation
        # --all-features ensures the `testutils` feature flag is active so the
        # Soroban test helpers (mock_all_auths, Ledger trait, etc.) are compiled in.
        # --workspace collects coverage across every crate in the repo.
        # --lcov writes the machine-readable LCOV report consumed by the gate below
        # and by external badge/codecov services.
        run: |
          cargo llvm-cov \
            --workspace \
            --features sorostream-stream/testutils \
            --lcov \
            --output-path lcov.info \
            -- --test-threads=1

      - name: Upload LCOV report as artifact
        uses: actions/upload-artifact@v4
        with:
          name: lcov-report
          path: lcov.info
          retention-days: 14

      - name: Enforce 80% line coverage gate
        # Parse the LCOV summary produced by cargo-llvm-cov and fail the job if
        # the overall line coverage falls below the threshold.  The summary line
        # written to stdout looks like:
        #   Lines:    82.34%  (12345 / 15000)
        # We extract the percentage and compare it numerically.
        run: |
          SUMMARY=$(cargo llvm-cov report --lcov --input-files lcov.info 2>/dev/null || true)
          # Fallback: re-run in summary mode to get a plain-text percentage.
          PCT=$(cargo llvm-cov \
            --workspace \
            --features sorostream-stream/testutils \
            --summary-only \
            -- --test-threads=1 2>&1 \
            | grep -oP 'Lines\s*:\s*\K[0-9]+\.[0-9]+' \
            | head -1)

          echo "Measured line coverage: ${PCT}%"

          # bc arithmetic: returns 1 (true) if PCT < 80
          if echo "$PCT < 80" | bc -l | grep -q '^1$'; then
            echo "::error::Line coverage ${PCT}% is below the required 80% threshold."
            exit 1
          fi
          echo "Coverage gate passed (${PCT}% ≥ 80%)."

      - name: Generate HTML report (informational)
        # Only produced on the main branch push so PRs stay fast.
        if: github.ref == 'refs/heads/main'
        run: |
          cargo llvm-cov \
            --workspace \
            --features sorostream-stream/testutils \
            --html \
            --output-dir coverage-html \
            -- --test-threads=1

      - name: Upload HTML report
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: coverage-html/
          retention-days: 30
