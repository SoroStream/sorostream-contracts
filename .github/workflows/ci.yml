name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  property-tests:
    name: Property Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check stream test module declarations
        run: python3 scripts/check_stream_test_modules.py
      - name: Check StreamError variant limit
        run: |
          count=$(grep -cE '^[[:space:]]+[[:alnum:]_]+ = [0-9]+,?$' contracts/stream/src/errors.rs)
          echo "StreamError variants: $count / 50"
          if [[ "$count" -gt 50 ]]; then
            echo "::error::StreamError has $count variants; Soroban supports at most 50. Consolidate a variant before building."
            exit 1
          fi
      - name: Property-based tests (1,000 iterations per property)
        env:
          PROPTEST_CASES: 1000
        run: cargo test proptest_tests -- --nocapture
        timeout-minutes: 10
      - name: Fee conservation properties (10,000 cases)
        env:
          PROPTEST_CASES: 10000
        run: cargo test -p sorostream-stream --lib issue_647_tests -- --nocapture
        timeout-minutes: 20
      - name: feat/39 create-stream fuzz (10,000 cases, fixed seed)
        env:
          PROPTEST_CASES: 10000
        run: cargo test issue_39_tests -- --nocapture
        timeout-minutes: 15
      - name: feat/6 resume paused-at reset tests
        run: cargo test issue_6_tests -- --nocapture
        timeout-minutes: 5
      - name: feat/37 sender stream cap tests
        run: cargo test issue_37_tests -- --nocapture
        timeout-minutes: 5
      - name: Duplicate stream ID collision tests
        run: cargo test duplicate_id_tests -- --nocapture
        timeout-minutes: 5

  debug-accounting-fuzz:
    name: Debug Accounting and Randomized Suites
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      RUSTFLAGS: -C debug-assertions=yes
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Chaos campaigns with accounting invariants enabled
        run: cargo test -p sorostream-stream --lib chaos -- --nocapture
      - name: Differential fuzz with accounting invariants enabled
        run: cargo test -p sorostream-stream --lib differential_fuzz -- --nocapture

